<?xml version="1.0"?>
<!-- MegaFlash MAME: Open-Apple = left modifier (IIc solid apple left of space).
     Stock MAME binds Open-Apple to Left Alt/Option only; also accept Left ⌘. -->
<mameconfig version="10">
    <system name="apple2c4">
        <input>
            <keyboard tag=":" enabled="1" />
            <!-- keyb_special bit 0x10 = Open Apple ($C061) -->
            <port tag=":keyb_special" type="KEYBOARD" mask="16" defvalue="0">
                <newseq type="standard">
                    KEYCODE_LALT OR KEYCODE_LWIN
                </newseq>
            </port>
            <!-- keyb_special bit 0x20 = Solid/Closed Apple ($C062) -->
            <port tag=":keyb_special" type="KEYBOARD" mask="32" defvalue="0">
                <newseq type="standard">
                    KEYCODE_RALT OR KEYCODE_RWIN
                </newseq>
            </port>
        </input>
    </system>
</mameconfig>
